# Diffusion Transformer Policy (DiffuseLoco) Baseline Experiments
# Usage: python demo_isaaclab.py --exp experiments/diffuseloco_baseline.yaml -c diffuseloco
#
# Faithful implementation using:
# - diffuselocoScheduler from diffusers
# - LowdimMaskGenerator for conditioning
# - Proper conditional_sample inference
# - Proper compute_loss training
# - No normalization (as requested)

# Diffusion Policy Hyperparameters Reference:
# - horizon: Length of action trajectory to generate
# - n_layer: Number of transformer decoder layers
# - n_head: Number of attention heads
# - n_emb: Embedding dimension
# - num_train_timesteps: Training diffusion steps (100 default)
# - num_inference_steps: Inference diffusion steps (20 default, fewer for speed)
# - beta_schedule: "linear" or "scaled_linear"
# - prediction_type: "epsilon" (predict noise) or "sample" (predict clean sample)
# - action_chunking: true/false - execute n_action_steps from sampled trajectory before re-planning
# - n_obs_steps: Number of observation timesteps in conditioning window (1 or 2)
# - n_action_steps: Number of actions to execute from sampled trajectory (only used if action_chunking: true)

